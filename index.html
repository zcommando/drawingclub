<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drawing Club · Gilbert, AZ</title>
  <meta name="description" content="Unique and fun drawing workshops for kids age 5–12. Coming soon in Gilbert, AZ.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fff8ec;
      --ink: #2b2340;
      --ink-soft: #5c5470;
      --red: #ff5a4e;
      --yellow: #ffc832;
      --blue: #3fa7f5;
      --green: #4cc38a;
      --purple: #9b6cf2;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background-color: var(--paper);
      background-image: radial-gradient(rgba(43, 35, 64, 0.07) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      color: var(--ink);
      font-family: "Nunito", system-ui, sans-serif;
      overflow-x: hidden;
    }

    main {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      text-align: center;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 720px;
    }

    .badge {
      display: inline-block;
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: clamp(1.5rem, 4vw, 1.9rem);
      color: var(--ink);
      background: var(--yellow);
      padding: 4px 22px 6px;
      border: 3px solid var(--ink);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      transform: rotate(-3deg);
      box-shadow: 4px 4px 0 var(--ink);
    }

    h1 {
      margin-top: 28px;
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: clamp(3.4rem, 13vw, 7.5rem);
      line-height: 0.95;
      letter-spacing: -0.01em;
    }

    h1 span { display: inline-block; }
    h1 .c1 { color: var(--red); transform: rotate(-4deg); }
    h1 .c2 { color: var(--blue); transform: translateY(-4px) rotate(3deg); }
    h1 .c3 { color: var(--green); transform: rotate(-2deg); }
    h1 .c4 { color: var(--purple); transform: translateY(3px) rotate(4deg); }
    h1 .c5 { color: var(--red); transform: rotate(-3deg); }
    h1 .c6 { color: var(--yellow); -webkit-text-stroke: 2px var(--ink); transform: translateY(-3px) rotate(2deg); }
    h1 .c7 { color: var(--blue); transform: rotate(-4deg); }
    h1 .club { display: block; color: var(--ink); margin-top: 4px; }

    .underline {
      display: block;
      width: min(380px, 70%);
      height: 24px;
      margin: 6px auto 0;
    }

    .underline path {
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      animation: draw 1.1s 0.3s ease-out forwards;
    }

    @keyframes draw { to { stroke-dashoffset: 0; } }

    .tagline {
      margin: 28px auto 0;
      max-width: 30ch;
      font-size: clamp(1.25rem, 3.6vw, 1.6rem);
      font-weight: 700;
      line-height: 1.35;
      color: var(--ink-soft);
      text-wrap: balance;
    }

    .tagline strong {
      color: var(--ink);
      background: linear-gradient(transparent 60%, rgba(63, 167, 245, 0.35) 60%);
      padding: 0 4px;
    }

    .location {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 36px;
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 1.15rem;
      color: var(--ink);
    }

    .location svg { flex: none; }

    /* Doodles */
    .doodle {
      position: absolute;
      pointer-events: none;
      animation: bob 6s ease-in-out infinite;
    }

    .d-star   { top: 9%;  left: 8%;  width: 64px; }
    .d-sun    { top: 7%;  right: 9%; width: 92px; animation-delay: -2s; }
    .d-spiral { bottom: 12%; left: 10%; width: 72px; animation-delay: -4s; }
    .d-pencil { bottom: 10%; right: 8%; width: 120px; animation-delay: -1s; }
    .d-heart  { top: 44%; left: 4%;  width: 44px; animation-delay: -3s; }
    .d-squig  { top: 40%; right: 4%; width: 70px; animation-delay: -5s; }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-10px) rotate(4deg); }
    }

    @media (max-width: 640px) {
      .d-star   { width: 42px; top: 4%; left: 5%; }
      .d-sun    { width: 58px; top: 3%; right: 5%; }
      .d-spiral { width: 46px; bottom: 5%; left: 6%; }
      .d-pencil { width: 78px; bottom: 4%; right: 5%; }
      .d-heart, .d-squig { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .doodle { animation: none; }
      .underline path { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Star -->
    <svg class="doodle d-star" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 5 L39 24 L59 25 L43 37 L49 57 L32 45 L15 57 L21 37 L5 25 L25 24 Z"
            fill="var(--yellow)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    </svg>

    <!-- Sun -->
    <svg class="doodle d-sun" viewBox="0 0 100 100" aria-hidden="true">
      <g stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round">
        <line x1="50" y1="6"  x2="50" y2="18"/>
        <line x1="50" y1="82" x2="50" y2="94"/>
        <line x1="6"  y1="50" x2="18" y2="50"/>
        <line x1="82" y1="50" x2="94" y2="50"/>
        <line x1="19" y1="19" x2="27" y2="27"/>
        <line x1="73" y1="73" x2="81" y2="81"/>
        <line x1="81" y1="19" x2="73" y2="27"/>
        <line x1="27" y1="73" x2="19" y2="81"/>
      </g>
      <circle cx="50" cy="50" r="22" fill="var(--red)" stroke="var(--ink)" stroke-width="3.5"/>
      <path d="M41 53 Q50 61 59 53" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="43" cy="45" r="2.5" fill="var(--ink)"/>
      <circle cx="57" cy="45" r="2.5" fill="var(--ink)"/>
    </svg>

    <!-- Spiral -->
    <svg class="doodle d-spiral" viewBox="0 0 80 80" aria-hidden="true">
      <path d="M40 40 a3 3 0 0 1 6 0 a6 6 0 0 1 -12 0 a9 9 0 0 1 18 0 a12 12 0 0 1 -24 0 a15 15 0 0 1 30 0 a18 18 0 0 1 -36 0"
            fill="none" stroke="var(--blue)" stroke-width="4" stroke-linecap="round"/>
    </svg>

    <!-- Pencil -->
    <svg class="doodle d-pencil" viewBox="0 0 140 50" aria-hidden="true">
      <g transform="rotate(-18 70 25)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round">
        <rect x="22" y="14" width="80" height="22" rx="2" fill="var(--green)"/>
        <line x1="22" y1="25" x2="102" y2="25" stroke-width="2" opacity=".35"/>
        <rect x="102" y="14" width="14" height="22" rx="1" fill="#c9c3d6"/>
        <path d="M116 14 h6 a6 6 0 0 1 0 22 h-6 Z" fill="#ff9fb2"/>
        <path d="M22 14 L4 25 L22 36 Z" fill="#f4d3a1"/>
        <path d="M10 21.4 L4 25 L10 28.6 Z" fill="var(--ink)"/>
      </g>
    </svg>

    <!-- Heart -->
    <svg class="doodle d-heart" viewBox="0 0 48 44" aria-hidden="true">
      <path d="M24 40 C8 28 3 20 3 13 C3 7 8 3 13 3 C18 3 22 6 24 10 C26 6 30 3 35 3 C40 3 45 7 45 13 C45 20 40 28 24 40 Z"
            fill="var(--purple)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    </svg>

    <!-- Squiggle -->
    <svg class="doodle d-squig" viewBox="0 0 70 30" aria-hidden="true">
      <path d="M4 15 Q12 3 20 15 T36 15 T52 15 T66 15" fill="none"
            stroke="var(--red)" stroke-width="4" stroke-linecap="round"/>
    </svg>

    <div class="content">
      <span class="badge">Coming soon!</span>

      <h1 aria-label="Drawing Club">
        <span aria-hidden="true">
          <span class="c1">D</span><span class="c2">r</span><span class="c3">a</span><span class="c4">w</span><span class="c5">i</span><span class="c6">n</span><span class="c7">g</span>
        </span>
        <span class="club" aria-hidden="true">Club</span>
      </h1>

      <svg class="underline" viewBox="0 0 380 24" preserveAspectRatio="none" aria-hidden="true">
        <path d="M6 14 C60 4 110 22 170 12 S280 4 374 13" fill="none"
              stroke="var(--yellow)" stroke-width="7" stroke-linecap="round"/>
      </svg>

      <p class="tagline">
        Unique and fun drawing workshops for <strong>kids age 5–12</strong>
      </p>

      <p class="location">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"
                fill="var(--red)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="12" cy="10" r="2.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
        </svg>
        Gilbert, Arizona
      </p>
    </div>
  </main>
</body>
</html>
